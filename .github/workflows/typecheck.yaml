name: Type-check frontend

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scope:
    uses: ./.github/workflows/ci_scope.yaml

  typecheck:
    needs: scope
    if: ${{ needs.scope.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # submodules: true pulls in baselayer, which tsconfig maps `baselayer/*`
      # to (baselayer/static/js/*); without it tsc can't resolve those imports.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Dependabot only edits package.json -- it cannot update bun.lock -- so a
      # frozen install fails before any check runs, and the job reports nothing
      # about the bump itself. Refresh the lockfile in-place for its PRs; the
      # lockfile still has to be regenerated and committed before merge.
      - name: Install JS dependencies
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            bun install
          else
            bun install --frozen-lockfile
          fi

      # Type-checks against the committed generated types (static/js/types/*).
      # The docs workflow separately verifies those stay in sync with the
      # OpenAPI spec, so together they catch frontend/backend type divergence:
      # this fails when frontend code stops matching the API's types.
      - name: Type-check (tsc --noEmit)
        run: bun run typecheck

  # Deliberately ungated: the client's correctness depends on projects/api-models,
  # which the frontend/backend split does not separate out.
  js-client:
    name: Check the JS client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            bun install
          else
            bun install --frozen-lockfile
          fi
          # Only the models package: the generator needs pydantic, nothing else.
          uv sync --package skyportal-py-models

      # Catches a model change that was made without regenerating, which would
      # otherwise show up as the client silently disagreeing with the server.
      - name: Regenerate the models and check for drift
        run: |
          uv run --package skyportal-py-models python tools/build-js-models.py
          git diff --exit-code projects/js-client/src/models || (
            echo "::error::projects/js-client/src/models is out of date; run 'make js-models' and commit."
            exit 1
          )

      - name: Type-check
        run: node ./node_modules/typescript7/bin/tsc --noEmit -p projects/js-client/tsconfig.json

      - name: Test
        run: bun test projects/js-client
